<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><linearGradient id="hero" x1="0" x2="1"><stop stop-color="#e8f2ff"/><stop offset="1" stop-color="#eefaf6"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#16345f" flood-opacity=".13"/></filter><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#2d609b"/></marker><style>.t{font-family:Arial,sans-serif;fill:#132d4c}.muted{font-family:Arial,sans-serif;fill:#5e7188}.h{font-family:Arial,sans-serif;font-weight:700;fill:#132d4c}.small{font-family:Arial,sans-serif;fill:#5e7188;font-size:18px}.box{stroke:#b9cde1;stroke-width:2}.arrow{stroke:#2d609b;stroke-width:4;fill:none;marker-end:url(#arrow)}</style></defs>
<rect width="1600" height="900" fill="#f7faff"/>
<rect x="112" y="30" width="1376" height="96" rx="24" fill="url(#hero)"/><text x="800" y="78" text-anchor="middle" class="h" font-size="40">Task-Aware Privacy Layer for Browser Agents</text><text x="800" y="108" text-anchor="middle" class="t" font-size="22">Let AI understand the task and screen — not unnecessary private information</text>
<!-- User --> <g filter="url(#shadow)"><rect class="box" x="48" y="194" width="180" height="196" rx="18" fill="#fff"/><circle cx="138" cy="249" r="30" fill="#d8e9ff" stroke="#3776b9" stroke-width="3"/><path d="M86 336c4-49 100-49 104 0" fill="#d8e9ff" stroke="#3776b9" stroke-width="3"/><text x="138" y="365" text-anchor="middle" class="h" font-size="21">User task</text><text x="138" y="417" text-anchor="middle" class="t" font-size="17">“Search Delhi →</text><text x="138" y="440" text-anchor="middle" class="t" font-size="17">Mumbai flights”</text></g>
<!-- Raw webpage --> <g filter="url(#shadow)"><rect class="box" x="278" y="165" width="280" height="292" rx="18" fill="#fff"/><text x="418" y="202" text-anchor="middle" class="h" font-size="22">Browser webpage</text><rect x="301" y="220" width="234" height="205" rx="8" fill="#f5f8fc" stroke="#d6e0ea"/><text x="318" y="250" class="h" font-size="17">✈  Book your flight</text><text x="319" y="284" class="t" font-size="16">From</text><rect x="388" y="267" width="125" height="26" rx="4" fill="#fff" stroke="#c7d3df"/><text x="398" y="286" class="t" font-size="15">Delhi</text><text x="319" y="318" class="t" font-size="16">To</text><rect x="388" y="301" width="125" height="26" rx="4" fill="#fff" stroke="#c7d3df"/><text x="398" y="320" class="t" font-size="15">Mumbai</text><text x="319" y="352" class="t" font-size="16">Name</text><rect x="388" y="335" width="125" height="26" rx="4" fill="#ffe5ea" stroke="#e88a9a"/><text x="398" y="354" class="t" font-size="15">Amit Soni</text><text x="319" y="386" class="t" font-size="16">Email</text><rect x="388" y="369" width="125" height="26" rx="4" fill="#ffe5ea" stroke="#e88a9a"/><text x="398" y="388" class="t" font-size="14">amit@gmail.com</text></g>
<path class="arrow" d="M229 292H270"/><path class="arrow" d="M559 292H603"/>
<!-- Privacy layer --> <g filter="url(#shadow)"><rect x="618" y="151" width="440" height="390" rx="22" fill="#f3fff9" stroke="#48ae7b" stroke-width="3" stroke-dasharray="8 6"/><text x="838" y="190" text-anchor="middle" class="h" font-size="25">🛡  Local browser privacy layer</text><rect x="646" y="215" width="184" height="88" rx="12" fill="#fff" stroke="#93c5ed" stroke-width="2"/><text x="738" y="249" text-anchor="middle" class="h" font-size="19">DOM analysis</text><text x="738" y="276" text-anchor="middle" class="small">labels • fields • buttons</text><rect x="848" y="215" width="184" height="88" rx="12" fill="#fff" stroke="#93c5ed" stroke-width="2"/><text x="940" y="249" text-anchor="middle" class="h" font-size="19">Visual map</text><text x="940" y="276" text-anchor="middle" class="small">visible geometry • OCR adapter</text><path class="arrow" d="M738 304v35h99"/><path class="arrow" d="M940 304v35h-103"/><rect x="680" y="341" width="314" height="65" rx="12" fill="#e7f1ff" stroke="#8ab6e5" stroke-width="2"/><text x="837" y="370" text-anchor="middle" class="h" font-size="20">Sensitive-data detection</text><text x="837" y="393" text-anchor="middle" class="small">name • email • phone • card • password</text><path class="arrow" d="M837 407v30"/><rect x="680" y="439" width="314" height="65" rx="12" fill="#fff6e7" stroke="#efbd6b" stroke-width="2"/><text x="837" y="468" text-anchor="middle" class="h" font-size="20">Task-aware decision engine</text><text x="837" y="491" text-anchor="middle" class="small">sensitive? + needed for task?</text></g>
<path class="arrow" d="M1059 292h55"/>
<!-- Sanitized --> <g filter="url(#shadow)"><rect class="box" x="1128" y="165" width="250" height="292" rx="18" fill="#fff"/><text x="1253" y="202" text-anchor="middle" class="h" font-size="21">AI-allowed context</text><rect x="1146" y="221" width="214" height="195" rx="8" fill="#112a46"/><text x="1160" y="253" fill="#d8efff" font-family="monospace" font-size="15">{</text><text x="1170" y="281" fill="#d8efff" font-family="monospace" font-size="14">task: flight_search</text><text x="1170" y="307" fill="#d8efff" font-family="monospace" font-size="14">from: Delhi</text><text x="1170" y="333" fill="#d8efff" font-family="monospace" font-size="14">to: Mumbai</text><text x="1170" y="359" fill="#73e1b7" font-family="monospace" font-size="14">email: [EMAIL]</text><text x="1170" y="385" fill="#ffcf78" font-family="monospace" font-size="14">card: [LOCAL_ONLY]</text><text x="1160" y="405" fill="#d8efff" font-family="monospace" font-size="15">}</text></g>
<path class="arrow" d="M1379 292h50"/>
<!-- Agent action --> <g filter="url(#shadow)"><rect class="box" x="1440" y="165" width="125" height="292" rx="18" fill="#fff"/><text x="1502" y="205" text-anchor="middle" class="h" font-size="18">Planner</text><text x="1502" y="232" text-anchor="middle" class="small">sanitized only</text><path class="arrow" d="M1502 258v52"/><text x="1502" y="341" text-anchor="middle" class="h" font-size="17">Local action</text><text x="1502" y="367" text-anchor="middle" class="small">click search</text><path class="arrow" d="M1502 386v34"/><text x="1502" y="443" text-anchor="middle" class="h" font-size="16">✓ verify</text></g>
<!-- Comparison --> <text x="48" y="596" class="h" font-size="28">Why our task-aware layer matters</text><g filter="url(#shadow)"><rect x="48" y="625" width="500" height="205" rx="16" fill="#fff4f5" stroke="#ef9aa9" stroke-width="2"/><text x="76" y="666" class="h" font-size="23">Raw page — AI should NOT receive this</text><text x="82" y="708" class="t" font-size="20">Delhi • Mumbai • Amit Soni • amit@gmail.com</text><text x="82" y="742" class="t" font-size="20">9876543210 • address • card • password</text><text x="82" y="793" fill="#ad2e4a" font-family="Arial" font-size="19" font-weight="700">Problem: full visual context leaks unrelated PII</text></g><path class="arrow" d="M565 728h75"/><g filter="url(#shadow)"><rect x="660" y="625" width="500" height="205" rx="16" fill="#effdf6" stroke="#72c59d" stroke-width="2"/><text x="688" y="666" class="h" font-size="23">Sanitized input — agent receives this</text><text x="694" y="708" class="t" font-size="20">Task: flight search · From: Delhi · To: Mumbai</text><text x="694" y="742" class="t" font-size="20">Name: [NAME] · Email: [EMAIL] · Phone: [PHONE]</text><text x="694" y="793" fill="#17744d" font-family="Arial" font-size="19" font-weight="700">Result: task works; unnecessary private values stay local</text></g><g filter="url(#shadow)"><rect x="1182" y="625" width="383" height="205" rx="16" fill="#eef5ff" stroke="#94bde9" stroke-width="2"/><text x="1211" y="666" class="h" font-size="23">PS 171 alignment</text><text x="1211" y="707" class="t" font-size="18">✓ local screen perception</text><text x="1211" y="739" class="t" font-size="18">✓ redact before network boundary</text><text x="1211" y="771" class="t" font-size="18">✓ server plan + local execution</text><text x="1211" y="803" class="t" font-size="18">✓ measurable latency &amp; audit log</text></g>
<text x="800" y="875" text-anchor="middle" class="h" font-size="25">AI can complete the task. Your unnecessary data stays on-device.</text>
</svg>
